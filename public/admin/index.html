<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Gul Makkai Palace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login" id="loginView" hidden>
    <form class="login-box" id="loginForm">
      <div class="seal">✦</div>
      <h1>Admin</h1>
      <p class="muted">Gul Makkai Palace</p>
      <label for="lUser">Username<input id="lUser" autocomplete="username" required></label>
      <label for="lPass">Password<input id="lPass" type="password" autocomplete="current-password" required></label>
      <p class="err" id="lErr" hidden></p>
      <button class="btn primary block">Log in</button>
    </form>
  </div>

  <div class="app" id="appView" hidden>
    <aside class="side" id="side">
      <div class="brand"><span class="seal sm">✦</span><div>Gul Makkai<small>Admin</small></div></div>
      <nav id="nav">
        <p class="grp">Overview</p>
        <a data-view="dashboard">Dashboard</a>
        <p class="grp">Bookings</p>
        <a data-view="bookings">Bookings <b class="pill" id="pendPill" hidden></b></a>
        <a data-view="calendar">Calendar</a>
        <p class="grp">Money &amp; staff</p>
        <a data-view="cashflow">Cashflow</a>
        <a data-view="reports">Reports &amp; audit</a>
        <a data-view="payroll">Payroll</a>
        <a data-view="t:employees">Employees</a>
        <p class="grp">Website</p>
        <a data-view="t:halls">Halls</a>
        <a data-view="t:packages">Packages &amp; menus</a>
        <a data-view="t:dishes">Menu dishes</a>
        <a data-view="t:addons">Add-ons &amp; extras</a>
        <a data-view="t:offers">Offers</a>
        <a data-view="gallery">Gallery</a>
        <a data-view="t:reviews">Reviews</a>
        <a data-view="settings">Settings</a>
        <p class="grp">Team</p>
        <a data-view="admins" data-owner>Admins</a>
        <a data-view="activity" id="navActivity">Activity</a>
        <a data-view="account">My account</a>
      </nav>
      <div class="side-foot">
        <div class="whoami" id="whoami"></div>
        <a class="btn ghost-l block" href="/" target="_blank" rel="noopener">View website ↗</a>
        <button class="btn ghost-l block" id="logout" type="button">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button class="burger" id="burger" type="button" aria-label="Menu">☰</button>
        <h2 id="viewTitle"></h2>
        <div class="top-actions" id="topActions"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-box"><button class="x" type="button" data-close aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
